# Instalador do app cliente para Windows (D-28, docs/12 seção 12.10): gerado numa máquina Windows,
# instalado e aberto lá mesmo (teste de fumaça). Numa tag de versão (v1.0.0...), vai para a página Releases.
name: Instalador do Windows

on:
  push:
    # A main e as branches de cada etapa (etapa-7-..., D-28); a tag de versão publica em Releases
    branches: [main, 'etapa-*']
    tags: ['v*']
    paths:
      - 'apps/cliente/**'
      - 'apps/compartilhado/**'
      - '.github/workflows/instalador-windows.yml'
  pull_request:
    paths:
      - 'apps/cliente/**'
      - 'apps/compartilhado/**'
      - '.github/workflows/instalador-windows.yml'
  workflow_dispatch:

concurrency:
  group: instalador-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instalador:
    name: Gerar, instalar e abrir o MedicalField-Setup.exe
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: apps/cliente
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/cliente/package-lock.json

      - name: Dependências
        run: npm ci

      - name: Versão da tag (v1.2.3 → 1.2.3)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Testes do cliente no Windows
        run: |
          npm run typecheck
          npm test

      - name: Gerar o instalador (NSIS)
        run: |
          npm run build
          npx electron-builder --win --publish never
          ls -la release/*.exe

      - name: Instalar sem perguntas e conferir os atalhos
        shell: pwsh
        run: |
          $instalador = Get-ChildItem release -Filter 'MedicalField-Setup-*.exe' | Select-Object -First 1
          Start-Process -FilePath $instalador.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'MedicalField.exe' | Select-Object -First 1
          if (-not $exe) { throw 'MedicalField.exe não foi instalado' }
          "INSTALADO=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $shell = New-Object -ComObject WScript.Shell
          $desktop = [Environment]::GetFolderPath('Desktop')
          $atalhos = Get-ChildItem $desktop -Filter 'MedicalField*.lnk'
          $atalhos | ForEach-Object { "{0} -> {1} {2}" -f $_.Name, $shell.CreateShortcut($_.FullName).TargetPath, $shell.CreateShortcut($_.FullName).Arguments }
          $segunda = $atalhos | Where-Object { $shell.CreateShortcut($_.FullName).Arguments -eq '--perfil=ambulancia-02' }
          if ($atalhos.Count -ne 2 -or -not $segunda) { throw 'Esperados 2 atalhos na área de trabalho, um com --perfil=ambulancia-02' }

      - name: Abrir o app instalado (teste de fumaça)
        run: node e2e/fumaca.mjs "$INSTALADO" "$(node -p "require('./package.json').version")"

      - name: Foto da primeira tela
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tela-do-app-instalado
          path: apps/cliente/e2e/telas/
          if-no-files-found: ignore
          retention-days: 14

      - name: Guardar o instalador
        uses: actions/upload-artifact@v7
        with:
          name: MedicalField-Setup
          path: apps/cliente/release/MedicalField-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  publicar:
    name: Publicar na página Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: instalador
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: MedicalField-Setup
      - name: Criar a versão com o instalador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" MedicalField-Setup-*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "MedicalField $GITHUB_REF_NAME" \
            --notes "Instalador do app cliente para Windows. Ver docs/12-implantacao.md, seção 12.10."
