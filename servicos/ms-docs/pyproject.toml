[project]
name = "ms-docs"
version = "1.0.0"
description = "MedicalField — PDF da ficha de atendimento e envio por e-mail"
requires-python = ">=3.13"
# Versões mínimas. As versões exatas instaladas (inclusive as indiretas) ficam em requirements.txt,
# gerado a partir daqui (ver o README).
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pyjwt[crypto]>=2.15",
    "httpx>=0.28",
    "weasyprint>=70",
    "jinja2>=3.1",
    "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    # Cliente HTTP do TestClient do Starlette 1.x (o httpx antigo ainda funciona, mas está obsoleto lá)
    "httpx2>=2.16",
    "aiosmtpd>=1.4.6",
    "pypdf>=6.21",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
