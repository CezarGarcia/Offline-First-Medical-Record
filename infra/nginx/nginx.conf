worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile          on;
  keepalive_timeout 65;
  server_tokens     off;

  # Log técnico do próprio Nginx. O log de AUDITORIA exigido pelo trabalho
  # é gravado por cada microsserviço no banco (ver docs/08-seguranca-e-auditoria.md).
  log_format principal '$remote_addr [$time_iso8601] "$request" $status '
                       '$body_bytes_sent ${request_time}s "$http_user_agent"';
  access_log /var/log/nginx/access.log principal;

  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  # DNS interno do Docker. O nome de cada serviço é resolvido na hora da requisição,
  # então o Nginx sobe mesmo que algum serviço ainda não exista ou esteja parado
  # (nesse caso a rota responde 503 SERVICO_INDISPONIVEL).
  resolver 127.0.0.11 valid=10s ipv6=off;

  include /etc/nginx/conf.d/*.conf;
}
