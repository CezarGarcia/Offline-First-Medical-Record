# Gateway único do MedicalField (padrão API Gateway).
#
#   /                  -> Portal Admin (arquivos estáticos do build do React)
#   /api/...           -> microsserviço dono da rota (sem reescrever o caminho)
#
# Mapa completo das rotas: docs/06-api.md

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 5m;

  # Cabeçalhos repassados a todos os serviços.
  # X-Real-IP leva o IP real de quem chamou: é ele que vai para o log de auditoria
  # (sem isso, os serviços veriam só o IP do próprio Nginx).
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version    1.1;
  proxy_connect_timeout 5s;
  proxy_read_timeout    60s;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # Serviço fora do ar (ou ainda não implantado) -> JSON padronizado.
  # Só vale para erros gerados pelo próprio Nginx; respostas de erro dos serviços passam intactas.
  error_page 502 503 504 = @servico_indisponivel;

  # ---------------- ms-auth (TypeScript): autenticação, profissionais e auditoria
  location ~ ^/api/((auth|profissional|log)(/|$)|docs/ms-auth$) {
    set $upstream http://ms-auth:3000;
    proxy_pass $upstream;
  }

  # ---------------- ms-clinico (Java): cadastros clínicos e sincronização
  location ~ ^/api/((pessoa|prontuario|atendimento|medicamento|sync|conflito)(/|$)|docs/ms-clinico$) {
    set $upstream http://ms-clinico:8080;
    proxy_pass $upstream;
  }

  # ---------------- ms-docs (Python): PDF da ficha e e-mail
  location ~ ^/api/(documentos(/|$)|docs/ms-docs$) {
    set $upstream http://ms-docs:8000;
    proxy_pass $upstream;
  }

  # ---------------- Qualquer outra rota da API
  location /api/ {
    default_type application/json;
    return 404 '{"erro":"NAO_ENCONTRADO","mensagem":"Rota não encontrada."}';
  }

  location @servico_indisponivel {
    default_type application/json;
    return 503 '{"erro":"SERVICO_INDISPONIVEL","mensagem":"O serviço responsável por esta rota está fora do ar. Tente novamente em instantes."}';
  }

  # ---------------- Portal Admin (build do React, dentro da imagem: apps/portal/Dockerfile)
  # Um add_header dentro de location substitui os do server, por isso os de segurança se repetem aqui.
  root /usr/share/nginx/html;

  # Arquivos com o hash no nome (gerados pelo Vite): podem ficar no cache do navegador sem prazo
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri =404;
  }

  # SPA: rotas do portal (/atendimentos, /logs/acesso...) caem no index.html, que nunca fica em cache
  # (assim uma versão nova do portal aparece logo depois do deploy)
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # Política de conteúdo (CSP): a página só carrega scripts, fontes e dados do próprio servidor. Se um XSS
    # conseguisse injetar HTML, um <script> embutido ou de outro site não rodaria, e nada sairia para outro
    # endereço (connect-src). Estilo embutido fica liberado: o Swagger UI e os componentes usam.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri $uri/ /index.html;
  }
}
