# MedicalField — infraestrutura do servidor (a VM da Univates faz o papel da "nuvem").
#
# Etapa 1: banco central (PostgreSQL) + gateway/portal (Nginx).
# Etapa 2: ms-auth (TypeScript).
# Etapa 3: ms-clinico (Java).
# Etapa 4: ms-docs (Python).
# Etapa 5: Portal Admin (React), servido pelo Nginx.
# Etapa 7: testes no GitHub Actions; o Mailpit (e-mail de teste) fica em docker-compose.teste.yml.
#
# Uso (dentro desta pasta infra/):
#   cp .env.example .env            # e troque as senhas
#   ./scripts/gerar-chaves-jwt.sh   # uma vez só
#   docker compose up -d --build
#
# Detalhes: docs/12-implantacao.md. Scripts de operação (instalar, verificar, zerar...): infra/scripts/
name: medicalfield

# Logs dos containers com tamanho limitado (3 arquivos de 10 MB por serviço): sem isso, eles crescem
# sem fim e, numa VM que fica semanas no ar, podem encher o disco
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18
    container_name: medicalfield-db
    logging: *logs
    restart: unless-stopped
    environment:
      POSTGRES_DB: medicalfield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      # Usados só pelo script de inicialização (postgres/init) para criar os usuários dos serviços
      MS_AUTH_DB_PASSWORD: ${MS_AUTH_DB_PASSWORD:?defina MS_AUTH_DB_PASSWORD no arquivo .env}
      MS_CLINICO_DB_PASSWORD: ${MS_CLINICO_DB_PASSWORD:?defina MS_CLINICO_DB_PASSWORD no arquivo .env}
      MS_DOCS_DB_PASSWORD: ${MS_DOCS_DB_PASSWORD:?defina MS_DOCS_DB_PASSWORD no arquivo .env}
      TZ: UTC
    volumes:
      # No Postgres 18 o volume é a pasta /var/lib/postgresql (os dados ficam em 18/docker)
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Só a própria VM acessa (127.0.0.1): o banco NÃO fica exposto na internet.
      # Porta 5433 para não colidir com um Postgres já instalado na VM (porta padrão 5432).
      - "127.0.0.1:${DB_PORTA_LOCAL:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medicalfield"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [interna]

  ms-auth:
    build: ../servicos/ms-auth
    image: medicalfield/ms-auth
    container_name: medicalfield-ms-auth
    logging: *logs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORTA: "3000"
      DB_HOST: db
      DB_PORTA: "5432"
      DB_NOME: medicalfield
      DB_USUARIO: ms_auth
      DB_SENHA: ${MS_AUTH_DB_PASSWORD:?defina MS_AUTH_DB_PASSWORD no arquivo .env}
      JWT_CHAVE_PRIVADA_ARQUIVO: /run/secrets/jwt-privada.pem
      JWT_CHAVE_PUBLICA_ARQUIVO: /run/secrets/jwt-publica.pem
      TZ: UTC
    secrets:
      - source: jwt_privada
        target: jwt-privada.pem
      - source: jwt_publica
        target: jwt-publica.pem
    healthcheck:
      # Teste de porta, não de rota HTTP: nenhuma rota fica aberta sem token (D-19)
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [interna]

  ms-clinico:
    build: ../servicos/ms-clinico
    image: medicalfield/ms-clinico
    container_name: medicalfield-ms-clinico
    logging: *logs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ms-auth:
        # O ms-auth cria as tabelas de auditoria, onde o log de acesso é gravado
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORTA: "5432"
      DB_NOME: medicalfield
      DB_USUARIO: ms_clinico
      DB_SENHA: ${MS_CLINICO_DB_PASSWORD:?defina MS_CLINICO_DB_PASSWORD no arquivo .env}
      JWT_CHAVE_PUBLICA_ARQUIVO: /run/secrets/jwt-publica.pem
      ESTRATEGIA_CONFLITO: ${ESTRATEGIA_CONFLITO:-MAIS_RECENTE_VENCE}
      TZ: UTC
    secrets:
      - source: jwt_publica
        target: jwt-publica.pem
    healthcheck:
      # Teste de porta, não de rota HTTP: nenhuma rota fica aberta sem token (D-19)
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks: [interna]

  ms-docs:
    build: ../servicos/ms-docs
    image: medicalfield/ms-docs
    container_name: medicalfield-ms-docs
    logging: *logs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ms-auth:
        # O ms-auth cria as tabelas de auditoria, onde o log de acesso é gravado
        condition: service_healthy
    environment:
      PORTA: "8000"
      DB_HOST: db
      DB_PORTA: "5432"
      DB_NOME: medicalfield
      DB_USUARIO: ms_docs
      DB_SENHA: ${MS_DOCS_DB_PASSWORD:?defina MS_DOCS_DB_PASSWORD no arquivo .env}
      JWT_CHAVE_PUBLICA_ARQUIVO: /run/secrets/jwt-publica.pem
      # A ficha é buscada no ms-clinico pela rede interna, com o token de quem pediu
      MS_CLINICO_URL: http://ms-clinico:8080
      # E-mail (docs/12-implantacao.md, seção 12.8). Sem SMTP_HOST o envio fica desligado.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORTA: ${SMTP_PORTA:-587}
      SMTP_SEGURANCA: ${SMTP_SEGURANCA:-}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      SMTP_REMETENTE: ${SMTP_REMETENTE:-}
      # Horário das datas no PDF e no e-mail (no banco tudo fica em UTC, D-23)
      FUSO_HORARIO: America/Sao_Paulo
      TZ: UTC
    secrets:
      - source: jwt_publica
        target: jwt-publica.pem
    healthcheck:
      # Teste de porta, não de rota HTTP: nenhuma rota fica aberta sem token (D-19)
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks: [interna]

  nginx:
    # Gateway + Portal Admin: a imagem é o Nginx com o build do portal dentro (apps/portal/Dockerfile)
    build:
      context: ../apps
      dockerfile: portal/Dockerfile
    image: medicalfield/nginx
    container_name: medicalfield-nginx
    logging: *logs
    restart: unless-stopped
    ports:
      # Única porta pública do sistema: portal + API (/api/...)
      - "${HTTP_PORTA:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      # O portal abre (a tela de login é estática, não depende de token)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [interna]

volumes:
  pgdata:

networks:
  interna:

# Chaves dos tokens JWT, geradas por scripts/gerar-chaves-jwt.sh (fora do Git).
# A privada só vai para o ms-auth; a pública vai para os três serviços.
secrets:
  jwt_privada:
    file: ./secrets/jwt-privada.pem
  jwt_publica:
    file: ./secrets/jwt-publica.pem
