# MedicalField — infraestrutura do servidor (a VM da Univates faz o papel da "nuvem").
#
# Etapa 1: banco central (PostgreSQL) + gateway/portal (Nginx).
# Etapa 2: ms-auth (TypeScript).
# ms-clinico e ms-docs entram nas próximas etapas.
#
# Uso (dentro desta pasta infra/):
#   cp .env.example .env            # e troque as senhas
#   ./scripts/gerar-chaves-jwt.sh   # uma vez só
#   docker compose up -d --build
#
# Detalhes: docs/12-implantacao.md
name: medicalfield

services:
  db:
    image: postgres:18
    container_name: medicalfield-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medicalfield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      # Usados só pelo script de inicialização (postgres/init) para criar os usuários dos serviços
      MS_AUTH_DB_PASSWORD: ${MS_AUTH_DB_PASSWORD:?defina MS_AUTH_DB_PASSWORD no arquivo .env}
      MS_CLINICO_DB_PASSWORD: ${MS_CLINICO_DB_PASSWORD:?defina MS_CLINICO_DB_PASSWORD no arquivo .env}
      MS_DOCS_DB_PASSWORD: ${MS_DOCS_DB_PASSWORD:?defina MS_DOCS_DB_PASSWORD no arquivo .env}
      TZ: UTC
    volumes:
      # No Postgres 18 o volume é a pasta /var/lib/postgresql (os dados ficam em 18/docker)
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Só a própria VM acessa (127.0.0.1): o banco NÃO fica exposto na internet.
      # Porta 5433 para não colidir com um Postgres já instalado na VM (porta padrão 5432).
      - "127.0.0.1:${DB_PORTA_LOCAL:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medicalfield"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [interna]

  ms-auth:
    build: ../servicos/ms-auth
    image: medicalfield/ms-auth
    container_name: medicalfield-ms-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORTA: "3000"
      DB_HOST: db
      DB_PORTA: "5432"
      DB_NOME: medicalfield
      DB_USUARIO: ms_auth
      DB_SENHA: ${MS_AUTH_DB_PASSWORD:?defina MS_AUTH_DB_PASSWORD no arquivo .env}
      JWT_CHAVE_PRIVADA_ARQUIVO: /run/secrets/jwt-privada.pem
      JWT_CHAVE_PUBLICA_ARQUIVO: /run/secrets/jwt-publica.pem
      TZ: UTC
    secrets:
      - source: jwt_privada
        target: jwt-privada.pem
      - source: jwt_publica
        target: jwt-publica.pem
    healthcheck:
      # Teste de porta, não de rota HTTP: nenhuma rota fica aberta sem token (D-19)
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [interna]

  nginx:
    image: nginx:1.29-alpine
    container_name: medicalfield-nginx
    restart: unless-stopped
    ports:
      # Única porta pública do sistema: portal + API (/api/...)
      - "${HTTP_PORTA:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Página provisória; na etapa 5 é substituída pelo build do Portal Admin
      - ./nginx/html:/usr/share/nginx/html:ro
    networks: [interna]

volumes:
  pgdata:

networks:
  interna:

# Chaves dos tokens JWT, geradas por scripts/gerar-chaves-jwt.sh (fora do Git).
# A privada só vai para o ms-auth; a pública vai para os três serviços.
secrets:
  jwt_privada:
    file: ./secrets/jwt-privada.pem
  jwt_publica:
    file: ./secrets/jwt-publica.pem
