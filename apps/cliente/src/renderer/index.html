<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- As telas não falam com a rede: tudo passa pelo núcleo local (IPC). Por isso connect-src fica só no próprio app -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws:"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>MedicalField</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
